name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'job_**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate PDFs
        run: python generate_pdf.py

      - name: Resolve deploy path
        id: deploy
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            SLUG="${BRANCH#job_}"
            COMPANY="${SLUG%%_*}"
            JOB="${SLUG#*_}"
            echo "path=${COMPANY}/${JOB}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _gh_pages

      - name: Sync docs to deploy path
        run: |
          DEST="_gh_pages/${{ steps.deploy.outputs.path }}"
          mkdir -p "$DEST"
          if [ "${{ steps.deploy.outputs.path }}" = "." ]; then
            # Root update: don't --delete so existing job subfolders are preserved
            rsync -a docs/ "$DEST/"
          else
            # Job subfolder: full sync, delete removed files
            rsync -a --delete docs/ "$DEST/"
          fi

      - name: Commit and push
        run: |
          cd _gh_pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to deploy." || \
            git commit -m "Deploy ${{ github.ref_name }} → ${{ steps.deploy.outputs.path }}"
          git push
