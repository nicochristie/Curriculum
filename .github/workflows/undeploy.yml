name: Undeploy from GitHub Pages

on:
  delete:

permissions:
  contents: write

jobs:
  undeploy:
    if: startsWith(github.event.ref, 'job_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove deploy path
        run: |
          BRANCH="${{ github.event.ref }}"
          SLUG="${BRANCH#job_}"
          COMPANY="${SLUG%%_*}"
          JOB="${SLUG#*_}"
          DEPLOY_PATH="${COMPANY}/${JOB}"

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Path $DEPLOY_PATH not found, nothing to remove."
            exit 0
          fi

          rm -rf "$DEPLOY_PATH"

          # Prune empty company directory
          if [ -d "$COMPANY" ] && [ -z "$(ls -A "$COMPANY")" ]; then
            rm -rf "$COMPANY"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove ${DEPLOY_PATH} (${BRANCH} deleted)"
          git push
